<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="1140" height="500" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1140" height="500" fill="#0f172a" rx="14"/>

  <!-- Title -->
  <text x="570" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="bold">Scalable Notification Service — Architecture</text>

  <!-- COLUMN 1: Source Services -->
  <rect x="28" y="185" width="110" height="42" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="83" y="211" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">E-Commerce Platform</text>

  <rect x="28" y="275" width="110" height="42" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="83" y="301" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="bold">Marketing System</text>

  <line x1="138" y1="206" x2="183" y2="242" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="138" y1="296" x2="183" y2="265" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- COLUMN 2: Load Balancer -->
  <rect x="183" y="210" width="118" height="82" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="203" y="222" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="222" y="222" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="241" y="222" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.4"/>
  <rect x="203" y="241" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.4"/>
  <rect x="222" y="241" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7"/>
  <rect x="241" y="241" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7"/>
  <text x="242" y="276" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Load Balancer</text>

  <line x1="301" y1="251" x2="345" y2="251" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- COLUMN 3: Notification Service -->
  <rect x="345" y="210" width="150" height="82" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="420" y="246" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Notification</text>
  <text x="420" y="262" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Service</text>
  <text x="420" y="280" text-anchor="middle" fill="#64748b" font-size="10">FastAPI · JWT · Rate Limit</text>

  <!-- up to User Preference -->
  <line x1="420" y1="210" x2="420" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- down to Scheduler -->
  <line x1="420" y1="292" x2="420" y2="345" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- right to RabbitMQ -->
  <line x1="495" y1="251" x2="548" y2="251" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- User Preference Service (top) -->
  <rect x="340" y="88" width="160" height="70" rx="8" fill="#1e1a3a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="115" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">User Preference</text>
  <text x="420" y="131" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Service</text>
  <text x="420" y="148" text-anchor="middle" fill="#64748b" font-size="10">Redis cache + PostgreSQL</text>

  <!-- Scheduler Service (bottom) -->
  <rect x="340" y="345" width="160" height="70" rx="8" fill="#1e1a3a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="373" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Scheduler Service</text>
  <text x="420" y="390" text-anchor="middle" fill="#64748b" font-size="10">polls DB · enqueues future</text>
  <text x="420" y="406" text-anchor="middle" fill="#64748b" font-size="10">notifications</text>

  <!-- COLUMN 4: RabbitMQ -->
  <rect x="548" y="196" width="132" height="110" rx="8" fill="#451a03" stroke="#f97316" stroke-width="1.5"/>
  <rect x="563" y="210" width="97" height="15" rx="4" fill="#f97316" opacity="0.3"/>
  <rect x="563" y="230" width="97" height="15" rx="4" fill="#f97316" opacity="0.5"/>
  <rect x="563" y="250" width="97" height="15" rx="4" fill="#f97316" opacity="0.3"/>
  <text x="614" y="285" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold">RabbitMQ</text>
  <text x="614" y="300" text-anchor="middle" fill="#64748b" font-size="9">email · sms · push · DLQ</text>

  <line x1="680" y1="251" x2="728" y2="251" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- COLUMN 5: Channel Processors -->
  <rect x="728" y="88" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="112" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">Email Processor</text>
  <text x="794" y="129" text-anchor="middle" fill="#64748b" font-size="10">SendGrid</text>

  <rect x="728" y="175" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="199" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">SMS Processor</text>
  <text x="794" y="216" text-anchor="middle" fill="#64748b" font-size="10">Twilio</text>

  <rect x="728" y="262" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="286" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">Push Processor</text>
  <text x="794" y="303" text-anchor="middle" fill="#64748b" font-size="10">FCM</text>

  <rect x="728" y="349" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="373" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">In-App Processor</text>
  <text x="794" y="390" text-anchor="middle" fill="#64748b" font-size="10">WebSocket</text>

  <!-- RabbitMQ → Processors -->
  <line x1="680" y1="225" x2="726" y2="134" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="680" y1="241" x2="726" y2="205" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="680" y1="262" x2="726" y2="282" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>
  <line x1="680" y1="278" x2="726" y2="362" stroke="#64748b" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- COLUMN 6: Recipients -->
  <circle cx="960" cy="115" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="110" text-anchor="middle" fill="#93c5fd" font-size="18">✉</text>
  <text x="960" y="128" text-anchor="middle" fill="#64748b" font-size="9">Inbox</text>

  <circle cx="960" cy="202" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="197" text-anchor="middle" fill="#93c5fd" font-size="18">📱</text>
  <text x="960" y="215" text-anchor="middle" fill="#64748b" font-size="9">Phone</text>

  <circle cx="960" cy="289" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="284" text-anchor="middle" fill="#93c5fd" font-size="18">🔔</text>
  <text x="960" y="302" text-anchor="middle" fill="#64748b" font-size="9">Device</text>

  <circle cx="960" cy="376" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="371" text-anchor="middle" fill="#93c5fd" font-size="18">🖥</text>
  <text x="960" y="389" text-anchor="middle" fill="#64748b" font-size="9">Browser</text>

  <!-- Processors → Recipients -->
  <line x1="860" y1="115" x2="934" y2="115" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="860" y1="202" x2="934" y2="202" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="860" y1="289" x2="934" y2="289" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="860" y1="376" x2="934" y2="376" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Recipients label -->
  <text x="1005" y="248" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold">Recipients</text>

  <!-- Monitoring -->
  <rect x="548" y="358" width="132" height="55" rx="8" fill="#0c1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="614" y="381" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">Monitoring</text>
  <text x="614" y="398" text-anchor="middle" fill="#64748b" font-size="10">Prometheus + Grafana</text>

  <line x1="614" y1="358" x2="614" y2="306" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <!-- Footer -->
  <line x1="28" y1="462" x2="1112" y2="462" stroke="#1e293b" stroke-width="1"/>
  <text x="570" y="482" text-anchor="middle" fill="#475569" font-size="10">All services containerized · Docker Compose · retry + exponential backoff on all processors</text>

</svg>
