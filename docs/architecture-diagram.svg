<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 500" width="1140" height="500" font-family="Segoe UI, Arial, sans-serif">

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f97316"/>
    </marker>

    <!-- Glow filters -->
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1140" height="500" fill="#0f172a" rx="14"/>

  <!-- Title -->
  <text x="570" y="34" text-anchor="middle" fill="#f1f5f9" font-size="16" font-weight="bold">Scalable Notification Service — Architecture</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN 1: Source Services -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="18" y="183" width="120" height="46" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="78" y="203" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">E-Commerce</text>
  <text x="78" y="218" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">Platform</text>

  <rect x="18" y="271" width="120" height="42" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="78" y="297" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Marketing System</text>

  <!-- Animated source → LB lines -->
  <line x1="138" y1="206" x2="183" y2="242" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)" opacity="0.4"/>
  <circle r="4" fill="#3b82f6" opacity="0.9">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0s">
      <mpath href="#path-src1"/>
    </animateMotion>
  </circle>
  <path id="path-src1" d="M138,206 L183,242" fill="none"/>

  <line x1="138" y1="292" x2="183" y2="262" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)" opacity="0.4"/>
  <circle r="4" fill="#3b82f6" opacity="0.9">
    <animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s">
      <mpath href="#path-src2"/>
    </animateMotion>
  </circle>
  <path id="path-src2" d="M138,292 L183,262" fill="none"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN 2: Load Balancer -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="183" y="210" width="118" height="82" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="203" y="222" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="222" y="222" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
  </rect>
  <rect x="241" y="222" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </rect>
  <rect x="203" y="241" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite" begin="0.9s"/>
  </rect>
  <rect x="222" y="241" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0.2s"/>
  </rect>
  <rect x="241" y="241" width="15" height="15" rx="2" fill="#3b82f6" opacity="0.7">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  <text x="242" y="276" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">Load Balancer</text>

  <!-- LB → Notification Service animated -->
  <line x1="301" y1="251" x2="345" y2="251" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr-blue)" opacity="0.4"/>
  <circle r="4" fill="#3b82f6">
    <animateMotion dur="1.2s" repeatCount="indefinite" begin="0.2s">
      <mpath href="#path-lb-api"/>
    </animateMotion>
  </circle>
  <path id="path-lb-api" d="M301,251 L345,251" fill="none"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN 3: Notification Service (pulsing) -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="345" y="210" width="150" height="82" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5" filter="url(#glow-green)">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text x="420" y="246" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Notification</text>
  <text x="420" y="262" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold">Service</text>
  <text x="420" y="280" text-anchor="middle" fill="#64748b" font-size="10">FastAPI · JWT · Rate Limit</text>

  <!-- API → User Preference -->
  <line x1="420" y1="210" x2="420" y2="158" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)" opacity="0.4"/>
  <circle r="3.5" fill="#8b5cf6">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="0.4s">
      <mpath href="#path-api-pref"/>
    </animateMotion>
  </circle>
  <path id="path-api-pref" d="M420,210 L420,158" fill="none"/>

  <!-- API → Scheduler -->
  <line x1="420" y1="292" x2="420" y2="345" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arr)" opacity="0.4"/>
  <circle r="3.5" fill="#8b5cf6">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1s">
      <mpath href="#path-api-sched"/>
    </animateMotion>
  </circle>
  <path id="path-api-sched" d="M420,292 L420,345" fill="none"/>

  <!-- API → RabbitMQ animated -->
  <line x1="495" y1="251" x2="548" y2="251" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)" opacity="0.4"/>
  <circle r="4" fill="#22c55e">
    <animateMotion dur="1s" repeatCount="indefinite" begin="0s">
      <mpath href="#path-api-mq"/>
    </animateMotion>
  </circle>
  <path id="path-api-mq" d="M495,251 L548,251" fill="none"/>

  <!-- API → In-App Service (direct HTTP, bypasses RabbitMQ) -->
  <line x1="495" y1="272" x2="726" y2="368" stroke="#8b5cf6" stroke-width="1.3" marker-end="url(#arr)" opacity="0.4" stroke-dasharray="5,3"/>
  <circle r="3.5" fill="#8b5cf6">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#path-api-inapp"/>
    </animateMotion>
  </circle>
  <path id="path-api-inapp" d="M495,272 L726,368" fill="none"/>

  <!-- User Preference Service -->
  <rect x="340" y="88" width="160" height="70" rx="8" fill="#1e1a3a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="115" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">User Preference</text>
  <text x="420" y="131" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Service</text>
  <text x="420" y="148" text-anchor="middle" fill="#64748b" font-size="10">Redis cache + PostgreSQL</text>

  <!-- Scheduler Service -->
  <rect x="340" y="345" width="160" height="70" rx="8" fill="#1e1a3a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="420" y="373" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">Scheduler Service</text>
  <text x="420" y="390" text-anchor="middle" fill="#64748b" font-size="10">polls DB · enqueues future</text>
  <text x="420" y="406" text-anchor="middle" fill="#64748b" font-size="10">notifications</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN 4: RabbitMQ (pulsing queues) -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="548" y="196" width="132" height="110" rx="8" fill="#451a03" stroke="#f97316" stroke-width="1.5"/>
  <rect x="563" y="210" width="97" height="15" rx="4" fill="#f97316" opacity="0.3">
    <animate attributeName="width" values="30;97;30" dur="2s" repeatCount="indefinite" begin="0s"/>
  </rect>
  <rect x="563" y="230" width="97" height="15" rx="4" fill="#f97316" opacity="0.5">
    <animate attributeName="width" values="60;97;60" dur="2s" repeatCount="indefinite" begin="0.4s"/>
  </rect>
  <rect x="563" y="250" width="97" height="15" rx="4" fill="#f97316" opacity="0.3">
    <animate attributeName="width" values="45;97;45" dur="2s" repeatCount="indefinite" begin="0.8s"/>
  </rect>
  <text x="614" y="285" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="bold">RabbitMQ</text>
  <text x="614" y="300" text-anchor="middle" fill="#64748b" font-size="9">email · sms · push · DLQ</text>

  <!-- RabbitMQ → Processors animated -->
  <line x1="680" y1="225" x2="726" y2="134" stroke="#f97316" stroke-width="1.3" marker-end="url(#arr-orange)" opacity="0.35"/>
  <circle r="3.5" fill="#f97316">
    <animateMotion dur="1.4s" repeatCount="indefinite" begin="0s">
      <mpath href="#path-mq-email"/>
    </animateMotion>
  </circle>
  <path id="path-mq-email" d="M680,225 L726,134" fill="none"/>

  <line x1="680" y1="241" x2="726" y2="205" stroke="#f97316" stroke-width="1.3" marker-end="url(#arr-orange)" opacity="0.35"/>
  <circle r="3.5" fill="#f97316">
    <animateMotion dur="1.4s" repeatCount="indefinite" begin="0.5s">
      <mpath href="#path-mq-sms"/>
    </animateMotion>
  </circle>
  <path id="path-mq-sms" d="M680,241 L726,205" fill="none"/>

  <line x1="680" y1="262" x2="726" y2="282" stroke="#f97316" stroke-width="1.3" marker-end="url(#arr-orange)" opacity="0.35"/>
  <circle r="3.5" fill="#f97316">
    <animateMotion dur="1.4s" repeatCount="indefinite" begin="1s">
      <mpath href="#path-mq-push"/>
    </animateMotion>
  </circle>
  <path id="path-mq-push" d="M680,262 L726,282" fill="none"/>

  <!-- In-App bypasses RabbitMQ — no arrow from MQ to In-App -->

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN 5: Channel Processors -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="728" y="88" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="112" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">Email Processor</text>
  <text x="794" y="129" text-anchor="middle" fill="#64748b" font-size="10">SendGrid</text>

  <rect x="728" y="175" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="199" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">SMS Processor</text>
  <text x="794" y="216" text-anchor="middle" fill="#64748b" font-size="10">Twilio</text>

  <rect x="728" y="262" width="132" height="55" rx="8" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="794" y="286" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="bold">Push Processor</text>
  <text x="794" y="303" text-anchor="middle" fill="#64748b" font-size="10">FCM</text>

  <rect x="728" y="349" width="132" height="55" rx="8" fill="#1e1a3a" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="794" y="373" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="bold">In-App Service</text>
  <text x="794" y="390" text-anchor="middle" fill="#64748b" font-size="10">WebSocket · HTTP direct</text>

  <!-- Processors → Recipients animated -->
  <line x1="860" y1="115" x2="934" y2="115" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)" opacity="0.4"/>
  <circle r="4" fill="#22c55e" filter="url(#glow-green)">
    <animateMotion dur="1s" repeatCount="indefinite" begin="1.4s">
      <mpath href="#path-del-email"/>
    </animateMotion>
  </circle>
  <path id="path-del-email" d="M860,115 L934,115" fill="none"/>

  <line x1="860" y1="202" x2="934" y2="202" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)" opacity="0.4"/>
  <circle r="4" fill="#22c55e" filter="url(#glow-green)">
    <animateMotion dur="1s" repeatCount="indefinite" begin="1.9s">
      <mpath href="#path-del-sms"/>
    </animateMotion>
  </circle>
  <path id="path-del-sms" d="M860,202 L934,202" fill="none"/>

  <line x1="860" y1="289" x2="934" y2="289" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)" opacity="0.4"/>
  <circle r="4" fill="#22c55e" filter="url(#glow-green)">
    <animateMotion dur="1s" repeatCount="indefinite" begin="2.4s">
      <mpath href="#path-del-push"/>
    </animateMotion>
  </circle>
  <path id="path-del-push" d="M860,289 L934,289" fill="none"/>

  <line x1="860" y1="376" x2="934" y2="376" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arr-green)" opacity="0.4"/>
  <circle r="4" fill="#22c55e" filter="url(#glow-green)">
    <animateMotion dur="1s" repeatCount="indefinite" begin="2.9s">
      <mpath href="#path-del-inapp"/>
    </animateMotion>
  </circle>
  <path id="path-del-inapp" d="M860,376 L934,376" fill="none"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- COLUMN 6: Recipients -->
  <!-- ═══════════════════════════════════════════ -->
  <circle cx="960" cy="115" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="110" text-anchor="middle" fill="#93c5fd" font-size="18">✉</text>
  <text x="960" y="128" text-anchor="middle" fill="#64748b" font-size="9">Inbox</text>

  <circle cx="960" cy="202" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="197" text-anchor="middle" fill="#93c5fd" font-size="18">📱</text>
  <text x="960" y="215" text-anchor="middle" fill="#64748b" font-size="9">Phone</text>

  <circle cx="960" cy="289" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="284" text-anchor="middle" fill="#93c5fd" font-size="18">🔔</text>
  <text x="960" y="302" text-anchor="middle" fill="#64748b" font-size="9">Device</text>

  <circle cx="960" cy="376" r="22" fill="#0f2744" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="960" y="371" text-anchor="middle" fill="#93c5fd" font-size="18">🖥</text>
  <text x="960" y="389" text-anchor="middle" fill="#64748b" font-size="9">Browser</text>

  <text x="1005" y="248" text-anchor="middle" fill="#64748b" font-size="11" font-weight="bold">Recipients</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Monitoring — below Notification Service, scrapes /metrics on API -->
  <!-- ═══════════════════════════════════════════ -->
  <rect x="165" y="358" width="150" height="55" rx="8" fill="#0c1a1a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="240" y="381" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="bold">Monitoring</text>
  <text x="240" y="398" text-anchor="middle" fill="#64748b" font-size="10">Prometheus + Grafana</text>

  <!-- Dashed scrape arrow: Prometheus → API /metrics -->
  <line x1="315" y1="381" x2="345" y2="265" stroke="#2dd4bf" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)" opacity="0.6"/>
  <circle r="3" fill="#2dd4bf" opacity="0.8">
    <animateMotion dur="2s" repeatCount="indefinite" begin="0s">
      <mpath href="#path-monitor"/>
    </animateMotion>
  </circle>
  <path id="path-monitor" d="M315,381 L345,265" fill="none"/>
  <!-- Scrape label -->
  <text x="320" y="340" fill="#2dd4bf" font-size="9" opacity="0.7">scrapes /metrics</text>

  <!-- Footer -->
  <line x1="28" y1="462" x2="1112" y2="462" stroke="#1e293b" stroke-width="1"/>
  <text x="570" y="482" text-anchor="middle" fill="#475569" font-size="10">All services containerized · Docker Compose · retry + exponential backoff on all processors</text>

</svg>
